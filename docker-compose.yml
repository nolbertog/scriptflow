version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: scriptflow-backend
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-scriptflow-prod-secret-change-me}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:80}
      - NODE_ENV=production
    volumes:
      - scriptflow-data:/app/packages/backend/prisma
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - scriptflow-network

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    container_name: scriptflow-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - scriptflow-network

networks:
  scriptflow-network:
    driver: bridge

volumes:
  scriptflow-data:
